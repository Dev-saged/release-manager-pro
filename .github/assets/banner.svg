<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Release Manager Pro</title>
  <desc id="d">مدير الإصدارات الذكي — Smart diffs, AI release notes and one-tap GitHub publishing</desc>
  <defs>
    <radialGradient id="glowV" cx=".1" cy="0" r=".75">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx=".96" cy="1" r=".6">
      <stop offset="0" stop-color="#2DD4A4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2DD4A4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8A93B8" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1240" y2="0">
      <stop offset="0" stop-color="#2A2F52" stop-opacity="0"/>
      <stop offset=".08" stop-color="#2A2F52"/>
      <stop offset=".92" stop-color="#2A2F52"/>
      <stop offset="1" stop-color="#2A2F52" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flowG" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1240" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#7C5CFF"/>
      <stop offset=".85" stop-color="#2DD4A4"/>
      <stop offset="1" stop-color="#2DD4A4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .en{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .ar{font-family:'Segoe UI',Tahoma,'Geeza Pro','Noto Sans Arabic',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .flow{stroke-dasharray:4 16;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.22,1,.36,1) infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
    .bar{animation:breathe 2.8s ease-in-out infinite}
    .b2{animation-delay:.35s}.b3{animation-delay:.7s}.b4{animation-delay:1.05s}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
    @keyframes twinkle{0%,100%{transform:scale(.8) rotate(0deg);opacity:.7}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0B0D18"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glowV)"/>
    <rect width="1280" height="400" fill="url(#glowM)"/>

    <!-- الهوية -->
    <rect x="80" y="50" width="318" height="30" rx="15" fill="#7C5CFF" fill-opacity=".14" stroke="#7C5CFF" stroke-opacity=".45"/>
    <text x="98" y="70" class="mono" font-size="13" fill="#B7A8FF">v2.6.0  ·  zero backend  ·  RTL-first</text>
    <text x="78" y="148" class="en" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#F1F2FA">Release Manager <tspan fill="#2DD4A4">Pro</tspan></text>
    <text x="80" y="200" class="ar" font-size="30" font-weight="700" fill="#D6D9EA">مدير الإصدارات الذكي — حلّل، اكتب، انشر</text>
    <text x="80" y="238" class="en" font-size="18" fill="#8C93B0">Smart diffs  ·  AI-written release notes  ·  One-tap GitHub publishing</text>

    <!-- بطاقة ملاحظات الإصدار -->
    <g class="float">
      <rect x="872" y="44" width="328" height="214" rx="18" fill="#121630" stroke="#2B3157"/>
      <rect x="892" y="64" width="78" height="26" rx="13" fill="#2DD4A4" fill-opacity=".14" stroke="#2DD4A4" stroke-opacity=".5"/>
      <text x="931" y="82" class="mono" font-size="13" text-anchor="middle" fill="#5EEAC0">v2.6.0</text>
      <text x="1150" y="83" class="ar" font-size="15" font-weight="700" text-anchor="end" fill="#E6E8F5">ملاحظات الإصدار</text>
      <path class="spark" d="M1172 70 L1175.5 79.5 L1185 83 L1175.5 86.5 L1172 96 L1168.5 86.5 L1159 83 L1168.5 79.5 Z" fill="#B7A8FF" transform="translate(4 0)"/>
      <line x1="892" y1="104" x2="1180" y2="104" stroke="#232848"/>

      <circle cx="1174" cy="127" r="5" fill="#2DD4A4"/>
      <text x="1160" y="132" class="ar" font-size="14" text-anchor="end" fill="#2DD4A4">إضافات جديدة</text>
      <rect class="bar" x="910" y="122" width="150" height="10" rx="5" fill="#2A3060"/>

      <circle cx="1174" cy="159" r="5" fill="#F5B83D"/>
      <text x="1160" y="164" class="ar" font-size="14" text-anchor="end" fill="#F5B83D">تحسينات</text>
      <rect class="bar b2" x="950" y="154" width="110" height="10" rx="5" fill="#2A3060"/>

      <circle cx="1174" cy="191" r="5" fill="#60A5FA"/>
      <text x="1160" y="196" class="ar" font-size="14" text-anchor="end" fill="#60A5FA">إصلاحات</text>
      <rect class="bar b3" x="928" y="186" width="132" height="10" rx="5" fill="#2A3060"/>

      <circle cx="1174" cy="223" r="5" fill="#FB7185"/>
      <text x="1160" y="228" class="ar" font-size="14" text-anchor="end" fill="#FB7185">إزالة وتنظيف</text>
      <rect class="bar b4" x="976" y="218" width="84" height="10" rx="5" fill="#2A3060"/>
    </g>

    <!-- مخطط الإصدارات -->
    <line x1="40" y1="330" x2="1240" y2="330" stroke="url(#rail)" stroke-width="3"/>
    <line class="flow" x1="40" y1="330" x2="1240" y2="330" stroke="url(#flowG)" stroke-width="2" stroke-linecap="round"/>
    <path d="M300 330 C350 330 340 286 392 286 L548 286 C600 286 590 330 640 330" fill="none" stroke="#7C5CFF" stroke-opacity=".75" stroke-width="2.5"/>
    <circle cx="440" cy="286" r="5" fill="#0B0D18" stroke="#7C5CFF" stroke-width="2.5"/>
    <circle cx="510" cy="286" r="5" fill="#0B0D18" stroke="#7C5CFF" stroke-width="2.5"/>

    <g fill="#0B0D18" stroke-width="2.5">
      <circle cx="120" cy="330" r="6" stroke="#F5B83D"/>
      <circle cx="210" cy="330" r="6" stroke="#8A93B8"/>
      <circle cx="300" cy="330" r="6" stroke="#8A93B8"/>
      <circle cx="640" cy="330" r="6" stroke="#F5B83D"/>
      <circle cx="760" cy="330" r="6" stroke="#8A93B8"/>
      <circle cx="880" cy="330" r="6" stroke="#F5B83D"/>
      <circle cx="1000" cy="330" r="6" stroke="#8A93B8"/>
    </g>
    <circle class="pulse" cx="1120" cy="330" r="8" fill="none" stroke="#2DD4A4" stroke-width="2"/>
    <circle cx="1120" cy="330" r="8" fill="#2DD4A4" filter="url(#glow)"/>

    <g class="mono" font-size="12" text-anchor="middle">
      <line x1="120" y1="337" x2="120" y2="350" stroke="#3A4070"/>
      <rect x="92" y="350" width="56" height="24" rx="12" fill="#161A36" stroke="#343A66"/>
      <text x="120" y="366" fill="#AEB4D0">v1.0</text>
      <line x1="640" y1="337" x2="640" y2="350" stroke="#3A4070"/>
      <rect x="612" y="350" width="56" height="24" rx="12" fill="#161A36" stroke="#343A66"/>
      <text x="640" y="366" fill="#AEB4D0">v2.0</text>
      <line x1="880" y1="337" x2="880" y2="350" stroke="#3A4070"/>
      <rect x="852" y="350" width="56" height="24" rx="12" fill="#161A36" stroke="#343A66"/>
      <text x="880" y="366" fill="#AEB4D0">v2.3</text>
      <line x1="1120" y1="339" x2="1120" y2="350" stroke="#2DD4A4" stroke-opacity=".6"/>
      <rect x="1092" y="350" width="56" height="24" rx="12" fill="#2DD4A4" fill-opacity=".12" stroke="#2DD4A4" stroke-opacity=".6"/>
      <text x="1120" y="366" fill="#5EEAC0">v2.6</text>
      <text x="1120" y="306" font-size="11" fill="#5EEAC0" fill-opacity=".85">latest</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="27.5" fill="none" stroke="#262B4A"/>
</svg>
